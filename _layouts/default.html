<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
</head>
<body>
<header class="wrap">
  <a class="mark" href="{{ '/' | relative_url }}">&#9837;5</a>
  <h1>{{ page.heading | default: site.title }}</h1>
  {% if page.tagline %}<p class="tagline">{{ page.tagline }}</p>{% endif %}
</header>

<main class="wrap">
{{ content }}
</main>

<footer class="wrap">
  <a href="{{ '/' | relative_url }}">Home</a> ·
  <a href="{{ '/guide/' | relative_url }}">User guide</a> ·
  <a href="{{ '/privacy/' | relative_url }}">Privacy</a> ·
  <a href="mailto:{{ site.support_email }}">Support</a>
</footer>
</body>
</html>
